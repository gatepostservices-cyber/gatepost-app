<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG = window.GATEPOST_CONFIG || {};
const CLOUD = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const sb = CLOUD ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: 'gatepost-auth' } }) : null;
window.gpSb = sb;

// ---------- State (same shape in both modes) ----------
let S = { me: null, users: [], estimates: [], events: [], requests: [], cust: { reqs: [], visits: [], people: [] } };

// ---------- Local-only fallback (single device, as before) ----------
const APP_KEY = 'gatepost_app_v1';
function lload() {
  try { const r = localStorage.getItem(APP_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return { users: [], currentUser: null, estimates: [], events: [], requests: [
    { id: 1, from: 'Lead runner', text: 'New lead: 1234 Example St — yard cleanup. Approve walk?', status: 'pending' },
    { id: 2, from: 'Bid clerk', text: 'Quote ready for Cochiti Rd SE. Send to client?', status: 'pending' } ] };
}
let L = CLOUD ? null : lload();
const lsave = () => localStorage.setItem(APP_KEY, JSON.stringify(L));
function lsync() {
  const u = L.users.find(x => x.email === L.currentUser);
  S = { me: u ? { email: u.email, role: u.role, access: u.access } : null,
        users: L.users.map(({password, ...r}) => r), estimates: L.estimates, events: L.events, requests: L.requests };
}

// ---------- Data API ----------
const API = {
  async init() {
    if (!CLOUD) { lsync(); return; }
    const { data: { session } } = await sb.auth.getSession();
    if (session) { await API.refresh(session); window.posthog && S.me && posthog.identify(S.me.id || S.me.email); }
    let ch = null;
    const sub = async (token) => { if (ch) await sb.removeChannel(ch); if (token) sb.realtime.setAuth(token);
      ch = sb.channel('gp').on('postgres_changes', { event: '*', schema: 'public' }, () => API.refresh().then(render)).subscribe(); };
    sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') { S.me = null; render(); }
      if (ev === 'SIGNED_IN' && s) setTimeout(() => sub(s.access_token), 0);
      if (ev === 'TOKEN_REFRESHED' && s) sb.realtime.setAuth(s.access_token); });
    await sub(session && session.access_token);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) API.refresh().then(render); });
  },
  async refresh(sess) {
    let { data: { user }, error } = await sb.auth.getUser();
    // Offline / network blip: keep the stored session instead of dropping to login.
    if (!user && error && !/session|jwt|token/i.test(error.message || '')) user = (sess || (await sb.auth.getSession()).data.session)?.user || null;
    if (!user) { S.me = null; return; }
    let { data: prof, error: pe } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    // Offline: reuse the last known profile so an approved user does not see "Access pending".
    if (pe && !prof) { try { const c = JSON.parse(localStorage.getItem('gp_me_cache') || 'null'); if (c && c.id === user.id) prof = c; } catch (_) {} }
    else if (prof) { try { localStorage.setItem('gp_me_cache', JSON.stringify({ id: prof.id, email: prof.email, role: prof.role, access: prof.access, is_owner: !!prof.is_owner, permissions: prof.permissions || {} })); } catch (_) {} }
    S.me = prof || { email: user.email, role: 'pending', access: false };
    if (!S.me.access) return;
    const { data: items } = await sb.from('items').select('*').order('created_at', { ascending: false });
    const it = items || [];
    S.estimates = it.filter(i => i.kind === 'estimate').map(i => ({ ...i.data, id: i.id, by: i.created_by, created: Date.parse(i.created_at) }));
    let evs = it.filter(i => i.kind === 'event').map(i => ({ ...i.data, id: i.id, by: i.created_by }));
    if (S.me.role !== 'admin') { // Outlook events: employees only get date/time/title from the database
      const { data: ol } = await sb.rpc('calendar_events_basic');
      evs = evs.concat((ol || []).map(e => ({ id: e.id, date: e.date, time: e.time, start: e.start_at, end: e.end_at, allDay: e.all_day, title: e.title, source: 'outlook', by: 'Outlook' })));
    }
    S.events = evs.sort((a,b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || ''));
    S.requests = it.filter(i => i.kind === 'request').map(i => ({ ...i.data, _data: i.data, id: i.id, status: i.status, reqKind: i.req_kind || 'todo', needsChristian: !!i.needs_christian, decidedBy: i.decided_by, decidedAt: i.decided_at, createdAt: i.created_at, createdBy: i.created_by }));
    if (S.me.role === 'admin') { const { data: us } = await sb.from('profiles').select('*').order('created_at'); S.users = us || []; await API.loadCustomers(); }
  },
  // Gatepost Home customers (admin only; RLS returns nothing to anyone else).
  async loadCustomers() {
    const [r, v, p] = await Promise.all([sb.from('customer_requests').select('*').order('created_at', { ascending: false }),
      sb.from('customer_visits').select('*').order('scheduled_for'), sb.from('customer_profiles').select('*')]);
    const rows = r.data || [], paths = rows.flatMap(x => x.photos || []), urls = {};
    if (paths.length) { const { data } = await sb.storage.from('customer-photos').createSignedUrls(paths, 3600); (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; }); }
    const profs = Object.fromEntries((p.data || []).map(x => [x.id, x]));
    S.cust = { reqs: rows.map(x => ({ ...x, photoUrls: (x.photos || []).map(q => urls[q]).filter(Boolean) })), visits: v.data || [],
      people: S.users.filter(u => u.role === 'customer').map(u => ({ id: u.id, email: u.email, ...(profs[u.id] || {}) })) };
  },
  async custUpdate(table, id, patch) {
    const { error } = await sb.from(table).update(patch).eq('id', id);
    if (error) { gpReportError(error, { op: table }); alert(error.message); } await API.loadCustomers();
  },
  async register(email, password) {
    if (!CLOUD) {
      if (L.users.find(u => u.email === email)) return 'Account already exists. Log in.';
      const first = L.users.length === 0;
      L.users.push({ email, password, name: email.split('@')[0], access: first, role: first ? 'admin' : 'employee', created: Date.now() });
      L.currentUser = email; lsave(); lsync(); return null;
    }
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return error.message;
    if (!data.session) return 'Check your email to confirm, then log in.';
    await API.refresh(); return null;
  },
  async login(email, password) {
    if (!CLOUD) {
      const u = L.users.find(x => x.email === email && x.password === password);
      if (!u) return 'Invalid email or password.';
      L.currentUser = email; lsave(); lsync(); return null;
    }

async function estAI() {
  const notes = (document.getElementById('notes').value || '').trim();
  const svc = document.getElementById('svc').value;
  const files = [...(document.getElementById('est-photos')?.files || [])];
  const box = document.getElementById('est-result');
  if (!notes && !files.length) { box.innerHTML = '<p class="muted">Add notes or a photo.</p>'; return; }
  if (!CLOUD) { box.innerHTML = '<p class="muted">AI pricing needs the synced app. You are in local mode.</p>'; return; }
  box.innerHTML = '<p class="muted">Pricing from the rate book…</p>';
  const images = [];
  try {
    for (const f of files.slice(0, 3)) {
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error('photo')); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(f); });
      if (data && data.length < 1500000) images.push({ mime: f.type || 'image/jpeg', data });
    }
  } catch (e) { box.innerHTML = '<p class="muted">Could not read a photo. Try a smaller one.</p>'; return; }
  const q = 'Price this Gatepost job. Notes: ' + (notes || '(see photos)') + '. Dropdown hint (ignore if the notes describe a different job): ' + svc + '. Prefer the Full Rate Book aim. If there is no row, use a typical Rio Rancho / Albuquerque one-crew average and mark it EXTERNAL. Never say we do not do that. Always return numbers.\nWORK: 0.00\nMATERIALS: 0.00\nSOURCE: INTERNAL or EXTERNAL\nWHY: one short line.';
  try {
    const session = (await sb.auth.getSession()).data?.session;
    if (!session) { box.innerHTML = '<p class="muted">Not signed in. Log in and try again.</p>'; return; }
    const call = (imgs) => fetch(CFG.SUPABASE_URL + '/functions/v1/ask-ai', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify(imgs.length ? { question: q, images: imgs, mode: 'estimate' } : { question: q, mode: 'estimate' }) });
    let r = await call(images);
    if (!r.ok && images.length) r = await call([]);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      const why = d.error === 'no_key' ? 'Gemini key is not set.' : d.error === 'rate_limited' || d.error === 'busy' ? 'AI is busy. Wait a minute.' : d.error === 'admins_only' ? 'Ask AI is for admins only.' : d.error === 'not_signed_in' ? 'Session expired. Log in again.' : (d.error || d.detail || ('AI error ' + r.status));
      box.innerHTML = '<p class="muted">' + esc(why) + '</p>'; return;
    }
    const text = d.answer || '';
    const wm = text.match(/WORK:\s*([0-9.]+)/i), mm = text.match(/MATERIALS:\s*([0-9.]+)/i);
    if (wm) document.getElementById('work').value = wm[1];
    if (mm) document.getElementById('materials').value = mm[1];
    if (!wm && !mm) { document.getElementById('est-result').innerHTML = '<p class="muted">' + esc(text || 'AI did not return a price.') + '</p>'; return; }
    calcEstimate(true);
    const src = ((text.match(/SOURCE:\s*(\w+)/i) || [])[1] || '').toUpperCase();
    const why = (text.match(/WHY:\s*(.+)/i) || [])[1];
    const res = document.getElementById('est-result');
    if (src === 'EXTERNAL') res.innerHTML = '<p style="color:var(--warn);font-weight:600;">External quote. Based on market averages, not our rate book. Double-check before sending.</p>' + res.innerHTML;
    if (why) res.innerHTML += '<p class="muted" style="margin-top:8px;">' + esc(why) + '</p>';
  } catch (e) { box.innerHTML = '<p class="muted">Could not reach AI. ' + esc(e.message || 'Check the connection.') + '</p>'; }
}
function calcEstimate(fromAI) {
  const svc = document.getElementById('svc').value, notes = document.getElementById('notes').value;

  const subtotal = Math.max(0, work + materials - discount), grt = +(subtotal * grtRate).toFixed(2), total = +(subtotal + grt).toFixed(2);

  el.innerHTML = (REQ_FILTER ? `<div class="req-filter">From <strong>${esc(REQ_FILTER)}</strong> · ${list.length}<button class="secondary" onclick="clearReqFilter()">Show all</button></div>` : '')
    + sec('Decisions to make', list.filter(isDecision), 'No decisions waiting on you.')
    + sec('Things to do', list.filter(r => !isDecision(r)), 'Nothing on the to-do list.'); }

// ---------- Request detail sheet ----------
let OPEN_REQ = null, REQ_EDIT = false, REQ_FILTER = null;
function clearReqFilter() { REQ_FILTER = null; renderRequests(); }
const fmtDate = d => { if (!d) return ''; const t = new Date(d); return isNaN(t) ? String(d) : t.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const linkify = u => { u = String(u); const safe = /^(https?:|tel:|mailto:|sms:)/i.test(u); const label = u.replace(/^tel:\+?1?/, '').replace(/^mailto:/, ''); return safe ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(u); };
const SKIP = new Set(['from', 'title', 'text', 'notes', 'sources', 'links', 'checklist', 'breakdown', 'id', '_data']);
const pretty = k => k.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
function openReq(id) { OPEN_REQ = id; REQ_EDIT = false; renderReqDetail(true); }
function closeReq() { OPEN_REQ = null; REQ_EDIT = false; document.getElementById('req-sheet')?.remove(); document.body.classList.remove('sheet-open'); }
function renderReqDetail(animate) {
  const prev = document.getElementById('req-sheet'), scroll = prev?.querySelector('.sheet-body')?.scrollTop || 0; prev?.remove();
  const r = S.requests.find(x => x.id === OPEN_REQ); if (!r) { closeReq(); return; }
  document.body.classList.add('sheet-open');
  const d = r._data || r, admin = isAdmin();
  const facts = Object.entries(d).filter(([k, v]) => !SKIP.has(k) && v !== null && v !== '' && typeof v !== 'object');
  if (r.phone && !(d.links || []).length) d.links = ['tel:' + String(r.phone).replace(/[^0-9+]/g, '')];
  const rows = [['From', esc(r.from) + ((d.sources || []).length > 1 ? ` <span class="muted">(also ${esc(d.sources.filter(x => x !== r.from).join(', '))})</span>` : '')],
    ['Received', esc(fmtDate(r.createdAt))], ...facts.map(([k, v]) => [pretty(k), esc(v)])];
  if (r.status !== 'pending') rows.push([r.status === 'approved' ? 'Approved' : r.status === 'denied' ? 'Declined' : pretty(r.status), esc([r.decidedBy, fmtDate(r.decidedAt)].filter(Boolean).join(' · '))]);
  const el = document.createElement('div'); el.id = 'req-sheet'; el.className = 'sheet' + (animate ? ' anim' : ''); el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="sheet-head"><button class="sheet-back" onclick="closeReq()" aria-label="Back">‹ Requests</button><span><span class="badge">${isDecision(r) ? 'Decision' : 'To-do'}</span>${r.needsChristian ? ' <span class="badge nc">Christian</span>' : ''} <span class="badge ${esc(r.status)}">${esc(r.status)}</span></span></div>
  <div class="sheet-body">
    <h2 class="sheet-title">${esc((d.title || '').trim() || 'Request')}</h2>
    ${REQ_EDIT ? `<label>Request text</label><textarea id="rq-text" rows="5">${esc(d.text)}</textarea>` : `<p class="sheet-text">${esc(d.text)}</p>`}
    <dl class="facts">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>
    ${d.breakdown && typeof d.breakdown === 'object' ? `<h3>Amount breakdown</h3><dl class="facts">${Object.entries(d.breakdown).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
    ${(d.checklist || []).length ? `<h3>To do / decide</h3><ul class="check">${d.checklist.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${(d.links || []).length ? `<h3>Links</h3><div class="links">${d.links.map(linkify).join('')}</div>` : ''}
    <h3>Notes</h3>${(d.notes || []).length ? d.notes.map(n => `<div class="note"><div>${esc(n.text)}</div><div class="muted">${esc(n.by || '')} · ${esc(fmtDate(n.at))}</div></div>`).join('') : '<p class="muted">No notes yet.</p>'}
    ${REQ_EDIT ? `<label>Add a note</label><textarea id="rq-note" rows="3" placeholder="e.g. Call him after 3, use 2x4s from the shop"></textarea>` : ''}
  </div>
  ${admin ? `<div class="sheet-actions">${REQ_EDIT
      ? `<button class="secondary" onclick="REQ_EDIT=false;renderReqDetail()">Cancel</button><button class="primary" onclick="saveReqEdit()">Save</button>`
      : `<button class="ok" onclick="reqDecide('approved')">Approve</button><button class="danger" onclick="reqDecide('denied')">Decline</button><button class="secondary" onclick="REQ_EDIT=true;renderReqDetail()">Modify</button>`}</div>` : ''}`;
  const nav = document.getElementById('sec-nav'); if (nav && !nav.classList.contains('hidden')) el.style.bottom = nav.getBoundingClientRect().height + 'px';
  document.body.appendChild(el);
  if (!animate && scroll) el.querySelector('.sheet-body').scrollTop = scroll;
}
async function reqDecide(status) { const id = OPEN_REQ; if (await API.updateRequest(id, { status })) { render(); if (OPEN_REQ === id) renderReqDetail(); } }
async function saveReqEdit() {
  const r = S.requests.find(x => x.id === OPEN_REQ); if (!r) return;
  const data = { ...(r._data || {}) }; const text = document.getElementById('rq-text').value.trim(), note = document.getElementById('rq-note').value.trim();
  if (text && text !== data.text) { data.notes = [...(data.notes || []), { text: 'Edited request text. Was: ' + data.text, by: S.me.email, at: new Date().toISOString() }]; data.text = text; }
  if (note) data.notes = [...(data.notes || []), { text: note, by: S.me.email, at: new Date().toISOString() }];
  const btn = document.querySelector('.sheet-actions .primary'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (await API.updateRequest(r.id, { data })) { REQ_EDIT = false; render(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN_REQ) closeReq(); });
async function decide(id, status) { await API.decide(id, status); renderRequests(); }

// ---------- Customers (Gatepost Home) admin section ----------
const CU_ST = { new: 'Received', reviewing: 'Reviewing', scheduled: 'Scheduled', done: 'Done', closed: 'Closed' };
const CU_TYPE = { repair: 'Repair', urgent: 'Urgent', addon: 'Add-on', cancel: 'Cancel' };
const CV_ST = { scheduled: 'Scheduled', done: 'Done', canceled: 'Canceled' };
const VISIT_TYPES = ['AC / furnace filter change', 'Weeding', 'Window cleaning', 'Pressure washing', 'Gutter check', 'Other'];
const cuName = id => { const p = S.cust.people.find(x => x.id === id); return p ? (p.full_name || p.email) : 'Customer'; };
const cuDue = r => { if (!r.due_at || ['done', 'closed'].includes(r.status)) return ''; const ms = Date.parse(r.due_at) - Date.now(), h = Math.floor(Math.abs(ms) / 3600e3), m = Math.floor(Math.abs(ms) % 3600e3 / 60e3);
  return `<span class="cu-due ${ms < 0 ? 'late' : ''}">${ms < 0 ? `Overdue ${h}h ${m}m` : `${h}h ${m}m left`}</span>`; };
const cuSel = (opts, cur, on) => `<select class="cu-sel" onchange="${on}">${Object.entries(opts).map(([k, v]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
function customersCard() {
  const open = r => !['done', 'closed'].includes(r.status);
  const reqs = [...S.cust.reqs].sort((a, b) => (open(b) - open(a)) || ((b.priority === 'urgent' && open(b)) - (a.priority === 'urgent' && open(a))) || b.created_at.localeCompare(a.created_at)); // TODO: then by plan tier once plans exist
  const now = Date.now() - 12 * 3600e3, visits = S.cust.visits.filter(v => Date.parse(v.scheduled_for) >= now || v.status === 'scheduled');
  return `<div class="card"><h2>Customers</h2><p class="muted">Gatepost Home requests (urgent first) and maintenance visits. ${S.cust.people.length} customer${S.cust.people.length === 1 ? '' : 's'}.</p>
    <h3 style="font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:14px 0 4px;">Requests</h3>
    ${reqs.length ? reqs.map(r => `<div class="item"><div class="req-top">${r.priority === 'urgent' ? '<span class="badge urgent">Urgent</span>' : `<span class="badge">${esc(CU_TYPE[r.type] || r.type)}</span>`} <strong>${esc(cuName(r.customer_id))}</strong> ${cuDue(r)}<span class="muted" style="margin-left:auto;font-size:.72rem;">${esc(fmtDate(r.created_at))}</span></div>
      <div style="margin-top:4px;white-space:pre-wrap;font-size:.9rem;">${esc(r.description)}</div>${r.address ? `<div class="muted" style="font-size:.8rem;">📍 ${esc(r.address)}</div>` : ''}
      ${r.photoUrls.length ? `<div class="cu-photos">${r.photoUrls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo" loading="lazy"></a>`).join('')}</div>` : ''}
      ${cuSel(CU_ST, r.status, `custSet('customer_requests',${Number(r.id)},{status:this.value})`)}</div>`).join('') : '<p class="muted">No customer requests yet.</p>'}
    <h3 style="font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:18px 0 4px;">Visits</h3>
    ${visits.length ? visits.map(v => `<div class="item"><div class="req-top"><strong>${esc(v.type)}</strong> · ${esc(cuName(v.customer_id))}<span class="muted" style="margin-left:auto;font-size:.75rem;">${esc(fmtDate(v.scheduled_for))}</span></div>
      ${v.notes ? `<div class="muted" style="font-size:.8rem;">${esc(v.notes)}</div>` : ''}${cuSel(CV_ST, v.status, `custSet('customer_visits',${Number(v.id)},{status:this.value})`)}</div>`).join('') : '<p class="muted">No visits scheduled.</p>'}
    ${S.cust.people.length ? `<details style="margin-top:10px;"><summary class="muted" style="cursor:pointer;">Schedule a visit</summary>
      <label>Customer</label><select id="cv-cust">${S.cust.people.map(p => `<option value="${esc(p.id)}">${esc(p.full_name ? p.full_name + ' · ' + p.email : p.email)}</option>`).join('')}</select>
      <label>Type</label><select id="cv-type">${VISIT_TYPES.map(t => `<option>${esc(t)}</option>`).join('')}</select>
      <label>When</label><input id="cv-when" type="datetime-local">
      <label>Notes (optional)</label><input id="cv-notes" placeholder="Gate code, filter size…">
      <button class="primary" style="margin-top:12px;" onclick="addVisit()">Add visit</button></details>` : ''}</div>`;
}
async function custSet(table, id, patch) { await API.custUpdate(table, id, patch); render(); }
async function addVisit() {
  const customer_id = document.getElementById('cv-cust').value, type = document.getElementById('cv-type').value, when = document.getElementById('cv-when').value, notes = document.getElementById('cv-notes').value.trim();
  if (!customer_id || !when) { alert('Pick a customer and a time.'); return; }
  const { error } = await sb.from('customer_visits').insert({ customer_id, type, scheduled_for: new Date(when).toISOString(), notes: notes || null });
  if (error) { gpReportError(error, { op: 'customer_visits' }); alert(error.message); return; }
  await API.loadCustomers(); render();
}

const roleLabel = r => ({ admin: 'Admin', employee: 'Employee', pending: 'No access (pending)', customer: 'Customer' })[r] || r;
const isOwnerRow = u => !!u.is_owner;
function adminPage() { if (!isAdmin()) return '<div class="card">Admin only.</div>';
  const pend = S.users.filter(u => u.role === 'pending').length;
  return `<div class="card"><h2>Team</h2><p class="muted">New sign-ups start with no access. Employees see the calendar and their own info. Admins see everything, including requests, pricing and this screen. Owners are admins who can also set each person's own permissions.</p>
    ${pend ? `<p style="margin-top:10px;"><span class="badge pending">${pend} waiting for access</span></p>` : ''}<div id="user-list"></div></div>`; }
function renderUsers() { const el = document.getElementById('user-list'); if (!el) return;
  const order = { pending: 0, employee: 1, admin: 2 };
  el.innerHTML = S.users.filter(u => u.role !== 'customer').sort((a, b) => order[a.role] - order[b.role] || a.email.localeCompare(b.email)).map(u => {
    const me = S.me && u.id === S.me.id, owner = isOwnerRow(u), locked = me || owner;
    const opt = (r, label) => `<button class="seg ${u.role === r ? 'on' : ''}" ${locked || u.role === r ? 'disabled' : ''} onclick="setRole('${esc(u.id)}','${r}')">${label}</button>`;
    return `<div class="item team-row"><div class="team-top"><strong>${esc(u.email)}</strong>${owner ? ' <span class="badge approved">Owner</span>' : ''}${me ? ' <span class="badge">You</span>' : ''}</div>
      <div class="muted" style="font-size:.78rem;">${owner ? 'Owner · Admin' : esc(roleLabel(u.role))}${u.created_at ? ' · joined ' + esc(new Date(u.created_at).toLocaleDateString([], { month: 'short', day: 'numeric' })) : ''}</div>
      ${locked ? '' : `<div class="segs">${opt('employee', 'Employee')}${opt('admin', 'Admin')}${opt('pending', 'Remove access')}</div>`}
      ${isOwner() ? `<details class="perm-box"><summary>Permissions${Object.keys(u.permissions || {}).length ? ' · ' + Object.keys(u.permissions).length : ''}</summary>
        <textarea id="perm-${esc(u.id)}" class="perm-json" rows="3" spellcheck="false">${esc(JSON.stringify(u.permissions || {}, null, 2))}</textarea>
        <button class="perm-save" onclick="savePerms('${esc(u.id)}')">Save permissions</button></details>` : ''}</div>`; }).join('') || '<p class="muted">No users yet.</p>'; }
async function setRole(id, role) {
  const u = S.users.find(x => x.id === id); if (!u) return;
  if (role === 'admin' && !confirm(`Make ${u.email} an admin? Admins see requests, pricing and can change roles.`)) return;
  if (role === 'pending' && !confirm(`Remove access for ${u.email}?`)) return;
  await API.setRole(id, role); render(); }
async function savePerms(id) { const el = document.getElementById('perm-' + id); if (!el || !isOwner()) return; let v;
  try { v = JSON.parse(el.value.trim() || '{}'); } catch (e) { alert('Not valid JSON: ' + e.message); return; }
  if (!v || typeof v !== 'object' || Array.isArray(v)) { alert('Permissions must be a JSON object like {"key": true}.'); return; }
  if (await API.setPerms(id, v)) render(); }


// ---------- Ask AI (admin only; history stays on this device) ----------
const ASK_KEY = 'gatepost_ask_ai_v1';
let ASK_BUSY = false;
const askLoad = () => { try { return JSON.parse(localStorage.getItem(ASK_KEY)) || []; } catch(e) { return []; } };
const askSave = h => localStorage.setItem(ASK_KEY, JSON.stringify(h.slice(-60)));
const askFmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]\n]{3,200})\]/g, '<span class="ask-cite">[$1]</span>').replace(/\n/g, '<br>');
function askPage() {
  // One AI entry point: the Gatepost AI chat (everyone) + Ask AI company-docs search (admins), both kept as they were.
  const chat = `<div class="card ai-card"><h2>AI assistant</h2><p class="muted" style="font-size:.8rem;">Gatepost AI is a quick chat about jobs, bids, hours, services and GRT.${isAdmin() ? ' Ask AI below searches the company files and live app data, with sources.' : ''}</p><button type="button" class="primary" id="open-gp-ai" onclick="window.openGatepostAI && openGatepostAI()">Open Gatepost AI chat</button></div>`;
  if (!isAdmin()) return chat;
  const h = askLoad();
  return chat + `<div class="card"><h2>Ask AI · company docs</h2><p class="muted" style="font-size:.8rem;">Answers come from the Gatepost files and live app data, with sources. Free Gemini tier. History is saved on this device only.</p>
    <div id="ask-log" class="ask-log">${h.length ? h.map(m => `<div class="ask-msg ${m.role}">${askFmt(m.text)}${m.sources && m.sources.length ? `<div class="ask-src">Sources: ${m.sources.map(esc).join(' · ')}</div>` : ''}</div>`).join('') : '<p class="muted">Try: "What do we charge for gutter cleaning?" or "What is on the calendar this week?"</p>'}${ASK_BUSY ? '<div class="ask-msg ai muted">Thinking…</div>' : ''}</div>
    <textarea id="ask-q" rows="3" placeholder="Ask about jobs, bids, pricing, leads, the calendar…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askSend();}"></textarea>
    <div class="row" style="margin-top:8px;"><button class="primary" onclick="askSend()" ${ASK_BUSY ? 'disabled' : ''}>Ask</button><button class="secondary" onclick="askClear()">Clear history</button></div></div>`;
}
function askAfterRender() { const l = document.getElementById('ask-log'); if (l) l.scrollTop = l.scrollHeight; }
function askClear() { if (confirm('Clear Ask AI history on this device?')) { localStorage.removeItem(ASK_KEY); render(); } }
async function askSend() {
  const box = document.getElementById('ask-q'), q = (box && box.value || '').trim(); if (!q || ASK_BUSY) return;
  const h = askLoad(); const prior = h.slice(-6).map(m => ({ role: m.role, text: m.text }));
  h.push({ role: 'me', text: q }); askSave(h); ASK_BUSY = true; render();
  let msg = { role: 'ai', text: '' };
  try {
    if (!CLOUD) throw new Error('local');
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/ask-ai', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (session && session.access_token) }, body: JSON.stringify({ question: q, history: prior }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { msg.text = d.answer; msg.sources = d.sources; }
    else msg.text = d.error === 'no_key' ? 'Ask AI is almost ready: the Gemini API key has not been set up yet. Christian can add it and this will start working.'
      : d.error === 'rate_limited' || d.error === 'busy' ? 'The free AI tier is busy right now. Please wait a minute and try again.'
      : d.error === 'admins_only' ? 'Ask AI is for admins only.' : 'Sorry, Ask AI could not answer right now. Please try again.';
  } catch (e) { msg.text = e.message === 'local' ? 'Ask AI needs the synced (cloud) app.' : 'Could not reach Ask AI. Check your connection and try again.'; }
  const h2 = askLoad(); h2.push(msg); askSave(h2); ASK_BUSY = false; render();
}
document.getElementById('main-nav').addEventListener('click', e => {
  if (OPEN_REQ) closeReq();
  if (window.closeBot) closeBot();
  if (e.target.tagName === 'BUTTON') REQ_FILTER = null;
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active'); render();
});
window.addEventListener('hashchange', () => { const pg = location.hash.slice(1) || 'town'; if (pg !== page()) document.querySelector(`.nav button[data-page="${pg}"]`)?.click(); });
// Render only after town.js/chat.js have loaded (a fast/offline session could otherwise render a blank town).
const domReady = new Promise(r => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r, { once: true }) : r());
Promise.all([API.init(), domReady]).then(()=>{ if (location.hash.length>1) document.querySelector(`.nav button[data-page="${location.hash.slice(1)}"]`)?.click(); render(); });
