<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gatepost">
<title>Gatepost</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="arch-mark.png">
<link rel="apple-touch-icon" href="arch-mark.png">
<style>
:root {
  --bg: #0f1410;
  --surface: #1a211c;
  --surface2: #242c26;
  --text: #f4f1ea;
  --muted: #a8a39a;
  --accent: #c4a574;
  --accent2: #8b7355;
  --green: #4a7c59;
  --danger: #c45c5c;
  --ok: #5a9a6a;
  --border: #2e382f;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; min-height: 100dvh; }
header {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
header img.logo { height: 36px; width: auto; }
header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
.nav {
  display: flex; gap: 4px; padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.nav button {
  background: transparent; border: 1px solid transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; white-space: nowrap; cursor: pointer;
}
.nav button.active { background: var(--surface2); color: var(--text); border-color: var(--border); }
main { flex: 1; padding: 16px; overflow-y: auto; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.card h2 { margin: 0 0 12px; font-size: 1.1rem; }
label { display: block; margin: 10px 0 4px; font-size: 0.85rem; color: var(--muted); }
input, select, textarea, button {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); font-size: 1rem;
}
button.primary { background: var(--green); border: none; color: white; font-weight: 600; cursor: pointer; }
button.secondary { background: transparent; border: 1px solid var(--border); }
button.danger { background: var(--danger); border: none; color: white; }
button.ok { background: var(--ok); border: none; color: white; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.muted { color: var(--muted); font-size: 0.85rem; }
.hidden { display: none !important; }
.event, .request, .estimate-item {
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.event:last-child, .request:last-child, .estimate-item:last-child { border-bottom: none; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; background: var(--surface2); }
.badge.pending { background: #5a4a2a; color: #e8d4a8; }
.badge.approved { background: #1e3a28; color: #8fcea8; }
footer { padding: 12px; text-align: center; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <img class="logo" src="arch-mark.png" alt="Gatepost">
  <h1>Gatepost</h1>
  <span style="margin-left:auto; font-size:0.8rem; color:var(--muted);" id="user-label"></span>
</header>
<nav class="nav" id="main-nav">
  <button data-page="dashboard" class="active">Hub</button>
  <button data-page="estimate">Estimate</button>
  <button data-page="calendar">Calendar</button>
  <button data-page="requests">Requests</button>
  <button data-page="admin" id="admin-tab" class="hidden">Admin</button>
</nav>
<main id="app">
  <!-- Auth screens and content injected by JS -->
</main>
<footer>Gatepost Property Services · Internal · (505) 750-3019</footer>

<script>
const APP_KEY = 'gatepost_app_v1';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(APP_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    users: [],
    currentUser: null,
    estimates: [],
    events: [],
    requests: [
      { id: 1, from: 'Lead runner', text: 'New lead: 1234 Example St — yard cleanup. Approve walk?', status: 'pending' },
      { id: 2, from: 'Bid clerk', text: 'Quote ready for Cochiti Rd SE. Send to client?', status: 'pending' }
    ]
  };
}
function saveState() {
  localStorage.setItem(APP_KEY, JSON.stringify(state));
}

function currentUser() {
  if (!state.currentUser) return null;
  return state.users.find(u => u.email === state.currentUser) || null;
}
function isApproved() {
  const u = currentUser();
  return u && u.access === true;
}
function isAdmin() {
  const u = currentUser();
  return u && u.role === 'admin';
}

function render() {
  const main = document.getElementById('app');
  const nav = document.getElementById('main-nav');
  const userLabel = document.getElementById('user-label');
  const adminTab = document.getElementById('admin-tab');

  const user = currentUser();
  if (!user) {
    nav.classList.add('hidden');
    userLabel.textContent = '';
    main.innerHTML = authScreen();
    return;
  }

  nav.classList.remove('hidden');
  userLabel.textContent = user.name || user.email.split('@')[0];
  adminTab.classList.toggle('hidden', !isAdmin());

  if (!isApproved()) {
    main.innerHTML = `<div class="card"><h2>Access pending</h2><p class="muted">Your account has 0 access. Admin will grant access.</p><button class="secondary" onclick="logout()">Log out</button></div>`;
    return;
  }

  const page = document.querySelector('.nav button.active')?.dataset.page || 'dashboard';
  if (page === 'dashboard') main.innerHTML = dashboard();
  else if (page === 'estimate') main.innerHTML = estimatePage();
  else if (page === 'calendar') main.innerHTML = calendarPage();
  else if (page === 'requests') main.innerHTML = requestsPage();
  else if (page === 'admin') main.innerHTML = adminPage();
}

function authScreen() {
  const fileNote = location.protocol === 'file:' 
    ? '<p class="muted" style="color:#e8d4a8;">Opened as a file. For best results, serve the folder or use a local server so images and home-screen install work.</p>' 
    : '';
  return `
    <div class="card">
      <h2>Gatepost</h2>
      <p class="muted">Internal operating hub. Employees self-register.</p>
      ${fileNote}
      <div id="auth-form">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@gatepost.services">
        <label>Password</label>
        <input id="password" type="password" placeholder="Create or enter password">
        <div class="row" style="margin-top:12px;">
          <button class="primary" onclick="doLogin()">Log in</button>
          <button class="secondary" onclick="doRegister()">Register</button>
        </div>
        <p id="auth-msg" class="muted" style="margin-top:8px;"></p>
      </div>
    </div>
  `;
}

function doRegister() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('auth-msg');
  if (!email || !password) { msg.textContent = 'Email and password required.'; return; }
  if (state.users.find(u => u.email === email)) { msg.textContent = 'Account already exists. Log in.'; return; }
  const isFirst = state.users.length === 0;
  state.users.push({
    email,
    password,
    name: email.split('@')[0],
    access: isFirst, // first user gets access and becomes admin
    role: isFirst ? 'admin' : 'employee',
    created: Date.now()
  });
  state.currentUser = email;
  saveState();
  render();
}

function doLogin() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('auth-msg');
  const user = state.users.find(u => u.email === email && u.password === password);
  if (!user) { msg.textContent = 'Invalid email or password.'; return; }
  state.currentUser = email;
  saveState();
  render();
}

function logout() {
  state.currentUser = null;
  saveState();
  render();
}

function dashboard() {
  const pendingReq = state.requests.filter(r => r.status === 'pending').length;
  const upcoming = state.events.filter(e => new Date(e.date) >= new Date()).length;
  return `
    <div class="card">
      <h2>Hub</h2>
      <p>Central source for Gatepost. Does not replace existing forms or tools.</p>
      <div class="row" style="margin-top:12px;">
        <div class="card" style="margin:0; flex:1; text-align:center;">
          <div style="font-size:1.4rem;">${pendingReq}</div>
          <div class="muted">Open requests</div>
        </div>
        <div class="card" style="margin:0; flex:1; text-align:center;">
          <div style="font-size:1.4rem;">${upcoming}</div>
          <div class="muted">Upcoming</div>
        </div>
      </div>
      <button class="secondary" style="margin-top:12px;" onclick="logout()">Log out</button>
    </div>
  `;
}

function estimatePage() {
  return `
    <div class="card">
      <h2>Estimate calculator</h2>
      <label>Service</label>
      <select id="svc">
        <option value="garden">Garden / Yard Cleanup</option>
        <option value="fence">Fence cut-down (short run)</option>
        <option value="dirt">Dirt haul (~2 CY)</option>
        <option value="handyman">Handyman / repairs</option>
        <option value="gutter">Gutter cleaning</option>
        <option value="moving">Moving help</option>
        <option value="trash">Trash / junk hauling</option>
      </select>
      <label>Scope notes</label>
      <textarea id="notes" rows="2" placeholder="What is included"></textarea>
      <label>Work amount</label>
      <input id="work" type="number" step="0.01" placeholder="0.00">
      <label>Materials amount</label>
      <input id="materials" type="number" step="0.01" placeholder="0.00">
      <label>Discount</label>
      <input id="discount" type="number" step="0.01" placeholder="0.00">
      <label>Location / GRT</label>
      <select id="grt">
        <option value="0.074375">Rio Rancho / Sandoval 7.4375%</option>
        <option value="0.07625">Albuquerque / Bernalillo 7.625%</option>
      </select>
      <button class="primary" style="margin-top:12px;" onclick="calcEstimate()">Calculate</button>
      <div id="est-result" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <h2>Saved estimates</h2>
      <div id="saved-ests"></div>
    </div>
  `;
}

function calcEstimate() {
  const svc = document.getElementById('svc').value;
  const notes = document.getElementById('notes').value;
  let work = parseFloat(document.getElementById('work').value) || 0;
  let materials = parseFloat(document.getElementById('materials').value) || 0;
  const discount = parseFloat(document.getElementById('discount').value) || 0;
  const grtRate = parseFloat(document.getElementById('grt').value);

  // Suggested bands if blank
  if (work === 0 && materials === 0) {
    if (svc === 'garden') { work = 650; materials = 0; }
    else if (svc === 'fence') { work = 275; materials = 0; }
    else if (svc === 'dirt') { work = 200; materials = 0; }
    else if (svc === 'handyman') { work = 250; materials = 80; }
    else if (svc === 'gutter') { work = 180; materials = 0; }
    else if (svc === 'moving') { work = 300; materials = 0; }
    else if (svc === 'trash') { work = 220; materials = 0; }
  }

  const subtotal = Math.max(0, work + materials - discount);
  const grt = +(subtotal * grtRate).toFixed(2);
  const total = +(subtotal + grt).toFixed(2);

  const result = document.getElementById('est-result');
  window._lastEstimate = { svc, notes, work, materials, discount, grt, total };
  result.innerHTML = `
    <div class="card" style="background:var(--surface2);">
      <strong>${svc}</strong>
      <div class="muted">${notes || '—'}</div>
      <div style="margin-top:8px;">Work: $${work.toFixed(2)}</div>
      <div>Materials: $${materials.toFixed(2)}</div>
      ${discount ? `<div>Discount: -$${discount.toFixed(2)}</div>` : ''}
      <div>Subtotal: $${subtotal.toFixed(2)}</div>
      <div>GRT: $${grt.toFixed(2)}</div>
      <div style="font-size:1.2rem; margin-top:6px;"><strong>TOTAL $${total.toFixed(2)}</strong></div>
      <button class="primary" style="margin-top:8px;" onclick="saveLastEstimate()">Save</button>
    </div>
  `;
}

function saveLastEstimate() {
  if (!window._lastEstimate) return;
  const est = { ...window._lastEstimate };
  est.id = Date.now();
  est.by = state.currentUser;
  est.created = Date.now();
  state.estimates.unshift(est);
  saveState();
  renderSaved();
  const result = document.getElementById('est-result');
  if (result) result.innerHTML += '<p class="muted" style="margin-top:8px;">Saved.</p>';
}

function renderSaved() {
  const el = document.getElementById('saved-ests');
  if (!el) return;
  if (!state.estimates.length) { el.innerHTML = '<p class="muted">None yet.</p>'; return; }
  el.innerHTML = state.estimates.map(e => `
    <div class="estimate-item">
      <strong>${e.svc}</strong> — $${e.total.toFixed(2)}
      <div class="muted">${e.notes || ''} · ${new Date(e.created).toLocaleDateString()}</div>
    </div>
  `).join('');
}

function calendarPage() {
  return `
    <div class="card">
      <h2>Calendar</h2>
      <label>Date</label>
      <input id="ev-date" type="date">
      <label>Title</label>
      <input id="ev-title" placeholder="Job start, walk, etc.">
      <button class="primary" style="margin-top:8px;" onclick="addEvent()">Add</button>
    </div>
    <div class="card">
      <h2>Events</h2>
      <div id="event-list"></div>
    </div>
  `;
}

function addEvent() {
  const date = document.getElementById('ev-date').value;
  const title = document.getElementById('ev-title').value.trim();
  if (!date || !title) return;
  state.events.push({ id: Date.now(), date, title, by: state.currentUser });
  state.events.sort((a,b) => a.date.localeCompare(b.date));
  saveState();
  renderEvents();
  document.getElementById('ev-title').value = '';
}

function renderEvents() {
  const el = document.getElementById('event-list');
  if (!el) return;
  if (!state.events.length) { el.innerHTML = '<p class="muted">No events.</p>'; return; }
  el.innerHTML = state.events.map(e => `
    <div class="event">
      <strong>${e.date}</strong> — ${e.title}
      <div class="muted">${e.by}</div>
    </div>
  `).join('');
}

function requestsPage() {
  return `
    <div class="card">
      <h2>Agent requests</h2>
      <p class="muted">Allow or deny. AI agents send these for admin review.</p>
      <div id="req-list"></div>
    </div>
  `;
}

function renderRequests() {
  const el = document.getElementById('req-list');
  if (!el) return;
  if (!state.requests.length) { el.innerHTML = '<p class="muted">None.</p>'; return; }
  el.innerHTML = state.requests.map(r => `
    <div class="request">
      <div><span class="badge ${r.status}">${r.status}</span> <strong>${r.from}</strong></div>
      <div style="margin:6px 0;">${r.text}</div>
      ${r.status === 'pending' && isAdmin() ? `
        <div class="row">
          <button class="ok" onclick="decide(${r.id}, 'approved')">Allow</button>
          <button class="danger" onclick="decide(${r.id}, 'denied')">Deny</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function decide(id, status) {
  const r = state.requests.find(x => x.id === id);
  if (r) { r.status = status; r.decidedBy = state.currentUser; r.decidedAt = Date.now(); }
  saveState();
  renderRequests();
}

function adminPage() {
  if (!isAdmin()) return '<div class="card">Admin only.</div>';
  return `
    <div class="card">
      <h2>Employees</h2>
      <p class="muted">New accounts start with 0 access. Grant access here.</p>
      <div id="user-list"></div>
    </div>
  `;
}

function renderUsers() {
  const el = document.getElementById('user-list');
  if (!el) return;
  el.innerHTML = state.users.map(u => `
    <div class="estimate-item">
      <strong>${u.email}</strong>
      <span class="badge ${u.access ? 'approved' : 'pending'}">${u.access ? 'Access' : '0 access'}</span>
      <span class="badge">${u.role}</span>
      ${u.role !== 'admin' ? `<button class="secondary" style="margin-top:6px; width:auto; padding:6px 12px;" onclick="toggleAccess('${u.email}')">${u.access ? 'Revoke' : 'Grant access'}</button>` : ''}
    </div>
  `).join('');
}

function toggleAccess(email) {
  const u = state.users.find(x => x.email === email);
  if (u && u.role !== 'admin') { u.access = !u.access; saveState(); renderUsers(); }
}

// Nav
document.getElementById('main-nav').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  render();
  // re-render dynamic lists after page switch
  setTimeout(() => {
    if (document.getElementById('saved-ests')) renderSaved();
    if (document.getElementById('event-list')) renderEvents();
    if (document.getElementById('req-list')) renderRequests();
    if (document.getElementById('user-list')) renderUsers();
  }, 0);
});

// Init
render();
</script>
</body>
</html>
