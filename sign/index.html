<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05070d">
<title>Sign your quote - Gatepost Property Services</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<style>
html,body{margin:0;background:#05070d;color:#eaf6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.box{max-width:560px;margin:0 auto;padding:24px 16px;text-align:center}.box img{height:40px;background:#f6f4ef;border-radius:10px;padding:8px 12px}
.box h1{font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-weight:500;letter-spacing:.04em}.btn{display:inline-block;margin-top:12px;padding:14px 20px;border-radius:12px;background:#5ff3ff;color:#05070d;font-weight:800;text-decoration:none;border:0;font-size:1rem}
</style>
</head>
<body>
<div class="box" id="msg"><img src="../logo.png" alt="Gatepost Property Services"><p>Loading your quote&hellip;</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=req1"></script>
<script src="../quotes-engine.js?v=2"></script>
<script src="../quotes-sign.js?v=1"></script>
<script src="../quotes.js?v=5"></script>
<script>
// Public customer sign page. No login. Loads only this quote's customer-facing fields via get_quote_for_signing(token).
(function () {
  const CFG = window.GATEPOST_CONFIG || {}, box = document.getElementById('msg');
  const say = (h, p, extra) => { box.innerHTML = '<img src="../logo.png" alt="Gatepost Property Services"><h1>' + h + '</h1><p>' + p + '</p>' + (extra || '') + '<p style="opacity:.7;font-size:.85rem">Questions? Call or text (505) 750-3019.</p>'; };
  const t = new URLSearchParams(location.search).get('t') || '';
  history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(t));
  if (!/^[A-Za-z0-9_-]{43,}$/.test(t) || !window.supabase) return say('Link not valid', 'This sign link is not valid. Please ask Gatepost for a new one.');
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  (async () => {
    const { data, error } = await sb.rpc('get_quote_for_signing', { p_token: t });
    if (error) return say('Something went wrong', 'We could not load this quote. Please try again in a minute.');
    if (data.error === 'signed') return say('Already signed', 'Quote ' + data.number + ' was signed ' + GPSign.denver(data.signed_at) + '. Thank you!');
    if (data.error === 'expired') return say('Link expired', 'This sign link has expired. Please ask Gatepost for a new one.');
    if (data.error) return say('Link not valid', 'This sign link is not valid. Please ask Gatepost for a new one.');
    const svc = ((window.QuotesEngine && QuotesEngine.FORMS[data.service] || {}).t || '').replace(/ \(PENDING\)/, '');
    box.innerHTML = '';
    GPSign.open(data, { title: svc, logo: '../logo.png', name: (data.customer || {}).name || '',
      onSubmit: async (sig, step) => {
        step('Making your signed PDF\u2026'); const pdf = await window.qBuildPdf(data, sig), stamp = String(Date.now()), dir = 'sign/' + t + '/';
        step('Uploading\u2026');
        const a = await sb.storage.from('quotes').upload(dir + stamp + '.png', GPSign.b64ToBlob(sig.png), { contentType: 'image/png' }); if (a.error) throw new Error(a.error.message);
        const b = await sb.storage.from('quotes').upload(dir + stamp + '.pdf', pdf, { contentType: 'application/pdf' }); if (b.error) throw new Error(b.error.message);
        const r = await sb.rpc('submit_quote_signature', { p_token: t, p_name: sig.name, p_signature_path: dir + stamp + '.png', p_signed_pdf_path: dir + stamp + '.pdf' }); if (r.error) throw new Error(r.error.message);
        const url = URL.createObjectURL(pdf);
        say('Thank you, ' + sig.name.split(' ')[0].replace(/[<>&"]/g, '') + '!', 'Quote ' + data.number + ' is signed (' + sig.atText + '). Gatepost has your signed copy.', '<a class="btn" id="dl" href="' + url + '" download="' + data.number + '-signed.pdf">Save my signed PDF</a>');
      } });
  })();
})();
</script>
</body>
</html>
